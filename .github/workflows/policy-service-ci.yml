name: Policy Service CI

on:
  push:
    branches:
      - main
    paths:
      - services/policy/**
      - .github/workflows/policy-service-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - services/policy/**
      - .github/workflows/policy-service-ci.yml

permissions:
  contents: read

jobs:
  policy-service:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
    defaults:
      run:
        working-directory: services/policy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/policy/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q

      - name: Check patch whitespace
        run: git diff --check
