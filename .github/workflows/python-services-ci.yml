name: Python Services CI

# Covers the Python services that have no dedicated workflow. Policy, Claims, and
# Orchestrator keep their own because they need service-specific setup; these four
# share an identical, dependency-free test contract, so one matrix avoids four
# near-identical files drifting apart.

on:
  push:
    branches: [main]
    paths:
      - services/copilot-rag/**
      - services/document-intelligence/**
      - services/eventing/**
      - services/legacy-adapter/**
      - .github/workflows/python-services-ci.yml
  pull_request:
    branches: [main]
    paths:
      - services/copilot-rag/**
      - services/document-intelligence/**
      - services/eventing/**
      - services/legacy-adapter/**
      - .github/workflows/python-services-ci.yml

permissions:
  contents: read

concurrency:
  group: python-services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing service in one run rather than stopping at the first.
      fail-fast: false
      matrix:
        service:
          - copilot-rag
          - document-intelligence
          - eventing
          - legacy-adapter
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run tests
        # No credentials are set: the suites must pass with no external provider,
        # which keeps CI hermetic and proves the offline defaults actually work.
        run: pytest -q

      - name: Check patch whitespace
        run: git diff --check
