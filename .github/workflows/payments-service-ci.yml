name: Payments Service CI
on:
  push:
    branches: [main]
    paths: [services/payments/**, .github/workflows/payments-service-ci.yml]
  pull_request:
    branches: [main]
    paths: [services/payments/**, .github/workflows/payments-service-ci.yml]
permissions:
  contents: read
jobs:
  payments-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/payments/package-lock.json
      - run: npm ci
      - run: npm test
      - run: git diff --check
